# Generate the Xcode project with:  cd ios && xcodegen generate
# (brew install xcodegen). The .xcodeproj is not committed.
name: LiveWire
options:
  bundleIdPrefix: com.REPLACE_ME_BUNDLE_PREFIX
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: REPLACE_ME_TEAM_ID
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  LiveWire:
    type: application
    platform: iOS
    sources:
      - path: LiveWire
        excludes:
          - "**/*.plist"
          - "**/*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.REPLACE_ME_BUNDLE_PREFIX.livewire
        PRODUCT_NAME: LiveWire
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: LiveWire/LiveWire.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
      configs:
        # Debug builds talk to the replay server over plain http://localhost:8000
        # (NSAllowsLocalNetworking). Release has no ATS exception at all.
        Debug:
          INFOPLIST_FILE: LiveWire/Info-Debug.plist
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          INFOPLIST_FILE: LiveWire/Info.plist
  LiveWireTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LiveWireTests
    dependencies:
      - target: LiveWire
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.REPLACE_ME_BUNDLE_PREFIX.livewire.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  LiveWire:
    build:
      targets:
        LiveWire: all
        LiveWireTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [LiveWireTests]
    archive:
      config: Release
